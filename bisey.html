<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kapalı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-color: #ff0055;
            --neon-glow: rgba(255, 0, 85, 0.6);
            --bg-color: #050505;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .background-effect {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(255, 0, 85, 0.1) 0%, transparent 70%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            text-align: center;
            z-index: 2;
            padding: 2rem;
            position: relative;
        }

        .glitch-wrapper {
            position: relative;
            margin-bottom: 2rem;
        }

        .status-code {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            color: #fff;
            text-shadow: 
                0 0 10px var(--neon-color),
                0 0 20px var(--neon-color),
                0 0 40px var(--neon-color);
            animation: flicker 2s infinite alternate;
            letter-spacing: 10px;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            color: #fff;
            opacity: 0.9;
        }

        p {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            max-width: 500px;
            margin: 0 auto;
        }

        .neon-line {
            width: 150px;
            height: 2px;
            background: var(--neon-color);
            margin: 2rem auto;
            box-shadow: 0 0 15px var(--neon-color);
            animation: pulse 2s infinite;
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow: 
                    0 0 10px var(--neon-color),
                    0 0 20px var(--neon-color),
                    0 0 40px var(--neon-color);
            }
            20%, 24%, 55% {
                text-shadow: none;
                opacity: 0.3;
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scaleX(1); }
            50% { opacity: 1; transform: scaleX(1.2); }
        }

        /* Scanline animation */
        .container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 2;
            background-size: 100% 2px, 2px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="background-effect"></div>
    
    <div class="container">
        <div class="glitch-wrapper">
            <div class="status-code">OFFLINE</div>
        </div>
        
        <h1>Erişim Kısıtlı</h1>
        <div class="neon-line"></div>
        <p>Üzgünüz, servis şu an kullanıma açık değil. Lütfen daha sonra tekrar kontrol ediniz.</p>
    </div>

    <script>
        // Subtle mouse interaction
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.container');
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            container.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });
    </script>
</body>
</html>
